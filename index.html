<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="2028학년도 수능까지 공부와 생활을 기록하는 개인용 수험생활 관리 앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="수험생활 기록">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./owls.css">
  <link rel="stylesheet" href="./v190.css">
  <title>2028 수험생활 통합 관리</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">28</div>
        <div><strong>STUDY ARCHIVE</strong><span>2028 수험생활 기록</span></div>
      </div>
      <div class="side-caption">WORKSPACE</div>
      <nav id="main-nav" class="main-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>홈</button>
        <button class="nav-item" data-view="planner"><span class="nav-icon">▦</span>기록 달력 · 시간표</button>
        <button class="nav-item" data-view="periodTasks"><span class="nav-icon">☷</span>기간별 할 일</button>
        <button class="nav-item" data-view="study"><span class="nav-icon">◷</span>공부 기록</button>
        <button class="nav-item" data-view="subjectTimer"><span class="nav-icon">▷</span>과목별 공부 타이머</button>
        <button class="nav-item" data-view="timer"><span class="nav-icon">◉</span>실전 타이머</button>
        <button class="nav-item" data-view="stats"><span class="nav-icon">⌁</span>공부 통계</button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">▧</span>공부 분석</button>
        <button class="nav-item" data-view="vault"><span class="nav-icon">▣</span>보물상자</button>
        <div class="side-caption nav-sub-caption">EXAM TRACKER</div>
        <button class="nav-item" data-view="exams"><span class="nav-icon">▤</span>실전 모의고사</button>
        <button class="nav-item" data-view="major"><span class="nav-icon">◎</span>주요 모의고사 성적</button>
        <button class="nav-item" data-view="dday"><span class="nav-icon">◷</span>시험 D-Day</button>
        <div class="side-caption nav-sub-caption">LIFE ARCHIVE</div>
        <button class="nav-item" data-view="books"><span class="nav-icon">▥</span>교재 책장</button>
        <button class="nav-item" data-view="life"><span class="nav-icon">☼</span>식사 · 운동</button>
        <button class="nav-item" data-view="diary"><span class="nav-icon">✎</span>일기</button>
        <button class="nav-item" data-view="dailyReview"><span class="nav-icon">☾</span>하루 공부 결산</button>
        <div class="side-caption nav-sub-caption">SYSTEM</div>
        <button class="nav-item" data-view="backup"><span class="nav-icon">⬡</span>백업 · 복원</button>
        <button class="nav-item" data-view="publicArchive"><span class="nav-icon">↗</span>공개 학습 아카이브</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>설정</button>
        <button class="nav-item" data-view="trash"><span class="nav-icon">⌫</span>휴지통</button>
      </nav>
      <div class="sidebar-footer">
        <div class="offline-indicator"><i></i><span id="connection-label">연결 확인 중</span></div>
        <small>내 기록은 이 기기에 저장됩니다.</small>
        <small class="app-version">v2.1.1</small>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="메뉴 열기">☰</button>
        <div class="breadcrumb"><span>MY SPACE</span><b>/</b><strong id="page-title">홈</strong></div>
        <div class="topbar-right">
          <span class="today-label" id="top-date"></span>
          <button class="icon-btn" id="quick-backup" title="빠른 백업" aria-label="빠른 백업">⇩</button>
        </div>
      </header>
      <section id="view-root" class="view-root" aria-live="polite"></section>
      <footer class="app-footer">개인 기록은 이 브라우저의 IndexedDB에 저장됩니다. 정기 백업은 별도로 보관해 주세요.</footer>
    </main>
  </div>

  <dialog id="app-modal" class="app-modal">
    <form method="dialog" class="modal-card" id="modal-form">
      <div class="modal-head"><div><p class="eyebrow" id="modal-eyebrow">RECORD</p><h2 id="modal-title">기록 추가</h2></div><button type="button" class="icon-btn" id="modal-close" aria-label="닫기">×</button></div>
      <div id="modal-content" class="modal-content"></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" id="modal-cancel">취소</button><button type="submit" class="btn btn-primary" id="modal-save">저장하기</button></div>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="global-overlay" class="global-overlay" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
